version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/commands/migrate/migrations"
    queries: "internal/commands/migrate/queries.sql"
    gen:
      go:
        package: "migratedb"
        out: "internal/commands/migrate/migratedb"
        sql_package: "pgx/v5"
