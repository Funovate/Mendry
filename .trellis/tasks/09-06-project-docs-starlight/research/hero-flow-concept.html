<main class="intro-shell not-content sl-markdown-content">
<section class="intro-hero" aria-labelledby="intro-title">
<div class="intro-hero-copy">
<p class="intro-eyebrow">客户自行管理的事故响应</p>
<h1 id="intro-title">FixThe</h1>
<p class="intro-summary">通过受限证据、可持久化推理和明确的人工审查路径调查生产事故。</p>
<p class="intro-authority">确定性运行不依赖远程大模型。可选的远程分析只接收脱敏上下文；合并与生产部署始终由人控制。</p>
<div class="intro-actions"><a class="intro-action intro-action-primary" href="../../../../docs/dist/zh-cn/docs/get-started/index.html">查看就绪状态 <span aria-hidden="true">→</span></a><a class="intro-action intro-action-secondary" href="../../../../docs/dist/zh-cn/docs/concepts/architecture/index.html">架构说明</a></div>
<p class="intro-preview-note"><span class="intro-status-dot" aria-hidden="true"></span>文档预览</p>
</div>
<figure class="visual" aria-label="事故信号、日志及代码上下文进入 FixThe 调查，产生诊断和候选方案，交由人工审查。合并与部署由人决定。">
<div class="diagram">
<div class="node"><div class="label"><b>01</b> 事故与上下文</div><div class="input-list"><div class="input"><span class="glyph" aria-hidden="true">!</span><div><strong>事故信号</strong><small>Incident signal</small></div></div><div class="input"><span class="glyph" aria-hidden="true">≡</span><div><strong>运行证据</strong><small>Runtime evidence</small></div></div><div class="input"><span class="glyph" aria-hidden="true">{ }</span><div><strong>代码上下文</strong><small>Code context</small></div></div></div></div>
<div class="arrow" aria-hidden="true"></div>
<div class="node"><div class="label"><b>02</b> 调查与关联</div><div class="engine"><div class="engine-head"><strong>FixThe</strong><span>INVESTIGATE</span></div><ul class="steps"><li><i aria-hidden="true"></i>采集受限证据</li><li><i aria-hidden="true"></i>关联代码上下文</li><li><i aria-hidden="true"></i>保留判断来源</li></ul></div></div>
<div class="down" aria-hidden="true"></div>
<div class="node output"><div class="label"><b>03</b> 诊断与候选方案</div><div class="document"><strong>有依据的调查结论</strong><p>诊断附带证据引用，<br>候选方案供人工评估。</p><div class="refs">证据来源 · 代码关联</div></div></div>
<div class="arrow return" aria-hidden="true"></div>
<div class="node human"><div class="label"><b>04</b> 人工审查</div><div class="approval"><strong>最终决定，交给人</strong><p>审查诊断与候选方案，<br>决定是否合并与部署。</p><span class="boundary">不会自动合并或部署</span></div></div>
</div>
<figcaption class="caption"><span>从事故信号到人工审查</span><span>证据可追溯 · 权限有边界</span></figcaption>
</figure>
</section>
<section class="context"><p>工作流程</p><h2>从信号到审查</h2></section>
</main>
